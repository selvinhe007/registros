<meta charset="UTF-8">
<title>Registro</title>

<style>
body{
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #817638, #a7a698);
  display: flex;
  flex-direction: column;
  align-items: center;
  color: rgb(14, 12, 12);
}

/* TITULO */
h1 {
  margin-top: 40px;
  font-weight: 600;
}

/* TARJETA MODERNA */
.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 20px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  margin-top: 20px;
}

/* FORM */
form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

label {
  font-size: 14px;
  color: #060707;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: rgb(36, 32, 32);
  font-size: 14px;
}

input::placeholder, textarea::placeholder {
  color: #2a2b2e;
}

input:focus, textarea:focus {
  outline: none;
  box-shadow: 0 0 8px #3b82f6;
}

/* BOTON */
button {
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: white;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px #3b82f6;
}

/* BOTON VOLVER */
.boton {
  display: block;
  text-align: center;
  margin-top: 15px;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.boton:hover {
  background: rgba(255,255,255,0.2);
}

/* NAV */
nav {
  margin-top: 40px;
  background: rgba(0,0,0,0.3);
  width: 100%;
  text-align: center;
  padding: 15px;
  backdrop-filter: blur(10px);
}

nav a {
  color: #cbd5f5;
  margin: 10px;
  text-decoration: none;
  font-weight: 500;
}

nav a:hover {
  color: #60a5fa;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .card {
    width: 95%;
  }
}
</style>
</head>

<body>

<h1>Registro de Contacto</h1>

<div class="card">

<form action="https://formspree.io/f/mqewqqpj" method="POST">

  <input type="hidden" name="_subject" value="nuevo correo verificado">
  <input type="hidden" name="_captcha" value="false">

  <div>
    <label>Nombre</label>
    <input type="text" name="name" placeholder="Tu nombre" required>
  </div>

  <div>
    <label>Correo</label>
    <input type="email" name="email" placeholder="correo@email.com" required>
  </div>

  <div>
    <label>Mensaje</label>
    <textarea name="message" placeholder="Escribe tu mensaje..." required></textarea>
  </div>

  <button type="submit">Enviar</button>

</form>

<a href="index.html" class="boton">⬅ Volver al Inicio</a>

</div>
</body>
</html>
